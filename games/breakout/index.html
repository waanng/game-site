<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碰碰球</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00f5d4;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            padding: 10px 20px;
            border: 2px solid #00f5d4;
            background: rgba(0, 0, 0, 0.8);
            transition: all 0.3s;
            z-index: 1000;
        }
        .back-link:hover {
            background: #00f5d4;
            color: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.5);
        }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-link">← 返回游戏库</a>
    <div class="game-container">
        <h1>碰碰球</h1>
        <canvas id="gameCanvas" width="480" height="400"></canvas>
        <div class="score-board">
            <span>总分: <span id="totalScore">0</span></span>
            <span>关卡: <span id="level">1</span></span>
            <span>连击: <span id="combo">0</span></span>
            <span>生命: <span id="lives">3</span></span>
        </div>
        <div class="controls">
            <p>使用 ← → 方向键 或 鼠标移动控制挡板</p>
            <button id="startBtn">开始游戏</button>
            <button id="restartBtn" style="display: none;">重新开始</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
